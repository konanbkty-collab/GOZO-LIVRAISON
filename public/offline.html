<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14448c">
    <title>GOZO — Connexion nécessaire</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #0e2f63; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; padding: 32px 24px; border-radius: 24px; background: white; box-shadow: 0 14px 40px #0e2f6318; }
      img { width: 72px; height: 72px; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { color: #64748b; line-height: 1.55; }
      button { margin-top: 12px; padding: 13px 22px; border: 0; border-radius: 14px; background: #14448c; color: white; font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="GOZO LIVRAISON">
      <h1>Connexion Internet nécessaire</h1>
      <p>GOZO a besoin d’Internet pour trouver les livreurs, calculer une course et actualiser le GPS. Vérifiez votre réseau puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
